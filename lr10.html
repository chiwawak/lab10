<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Однорукий бандит</title>
    <link rel="stylesheet" href="lr10.css">
</head>
<body>

    <div class="game-container">
        <h2 id="user-name">User</h2>
        <p id="attempt-counter">Спроба 0 з 3</p>

        <button id="generate-btn" type="button">Generate</button>

        <div class="slot-machine">
        
            <div class="column">
                <img id="slot-1-1" src="mitya.jpg" alt="Слот 1-1">
                <img id="slot-1-2" src="valeriy.jpg" alt="Слот 1-2">
                <img id="slot-1-3" src="alyosha.jpg" alt="Слот 1-3">
            </div>

            <div class="column">
                <img id="slot-2-1" src="diona.jpg" alt="Слот 2-1">
                <img id="slot-2-2" src="book.png" alt="Слот 2-2">
                <img id="slot-2-3" src="paimon.jpeg" alt="Слот 2-3">
            </div>

            <div class="column">
                <img id="slot-3-1" src="diona.jpg" alt="Слот 3-1">
                <img id="slot-3-2" src="book.png" alt="Слот 3-2">
                <img id="slot-3-3" src="paimon.jpeg" alt="Слот 3-3">
            </div>

        </div>

        <div id="result-message"></div>
    </div>
<script src="lr10.js"></script>
</body>
</html>
